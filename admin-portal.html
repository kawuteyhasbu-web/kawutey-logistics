<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Kawutey Logistics — Administrator Access</title>
<style>
:root{--blue:#0A2F6B;--orange:#FF6A00;--border:#d0d7e2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef2f7;color:#10264b;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(100%,520px)}header,.panel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 16px rgba(10,47,107,.08);margin-bottom:14px}
h1{font-size:1.35rem;color:var(--blue);margin:0}header p{margin:6px 0 0;color:#5d6675}
h2{font-size:1.1rem;color:var(--blue);margin:0 0 12px}
.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}
button{border:0;border-radius:9px;padding:12px 15px;background:var(--blue);color:#fff;font:inherit;font-weight:650;cursor:pointer}
button.secondary{background:#fff;color:var(--blue);border:1px solid var(--border)}
button:disabled{opacity:.6;cursor:not-allowed}
label{display:block;font-weight:650;margin:13px 0 6px}
input{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;font:inherit}
form>button{margin-top:16px;width:100%}
.notice{padding:12px;border-radius:9px;background:#e8f0fe;margin-top:14px}.error{background:#fce8e6;color:#8a1c13}.success{background:#d1e7dd;color:#0f5132}
.hidden{display:none!important}.small{font-size:.88rem;color:#5d6675}.back{color:var(--blue)}
</style>
</head>
<body><main>
<header><h1>Kawutey Logistics</h1><p>Private administrator access</p></header>
<section class="panel">
<div class="tabs"><button type="button" id="showSignIn">Admin Sign In</button><button type="button" class="secondary" id="showSignUp">Admin Sign Up</button></div>
<form id="signInForm">
<h2>Admin Sign In</h2>
<label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="username" required>
<label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required>
<button id="signInButton">Sign In</button>
</form>
<form id="signUpForm" class="hidden">
<h2>Admin Sign Up</h2>
<p class="small">Administrator registration requires an invitation code. A maximum of four administrator accounts is permitted.</p>
<label for="fullName">Full name</label><input id="fullName" maxlength="120" autocomplete="name" required>
<label for="registerEmail">Email address</label><input id="registerEmail" type="email" autocomplete="email" required>
<label for="registerPassword">Password (at least 14 characters)</label><input id="registerPassword" type="password" minlength="14" maxlength="128" autocomplete="new-password" required>
<label for="invitationCode">Private invitation code</label><input id="invitationCode" type="password" maxlength="256" autocomplete="off" required>
<button id="signUpButton">Create Admin Account</button>
</form>
<div id="message" class="notice hidden" role="status" aria-live="polite"></div>
</section>
<p class="small">Authorised administrators only. Do not share your invitation code or password.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const showMessage=(message,kind)=>{const el=$("message");el.textContent=message;el.className="notice "+(kind||"");};
function selectView(view){
  const signIn=view==="signin";
  $("signInForm").classList.toggle("hidden",!signIn);
  $("signUpForm").classList.toggle("hidden",signIn);
  $("showSignIn").classList.toggle("secondary",!signIn);
  $("showSignUp").classList.toggle("secondary",signIn);
  $("message").classList.add("hidden");
}
$("showSignIn").addEventListener("click",()=>selectView("signin"));
$("showSignUp").addEventListener("click",()=>selectView("signup"));
$("signInForm").addEventListener("submit",async event=>{
  event.preventDefault();$("signInButton").disabled=true;
  try{
    const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("loginEmail").value,password:$("loginPassword").value})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||"Sign-in failed.");
    if(data.user?.role!=="admin")throw new Error("This account is not an administrator.");
    sessionStorage.setItem("kl_admin_token",data.token);
    location.assign("/admin-dashboard?adminPortal="+encodeURIComponent(location.pathname));
  }catch(error){showMessage(error.message,"error");}
  finally{$("signInButton").disabled=false;}
});
$("signUpForm").addEventListener("submit",async event=>{
  event.preventDefault();$("signUpButton").disabled=true;
  try{
    const response=await fetch("/api/admin/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:$("fullName").value,email:$("registerEmail").value,password:$("registerPassword").value,invitationCode:$("invitationCode").value})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||"Registration failed.");
    const createdEmail=$("registerEmail").value;
    $("signUpForm").reset();selectView("signin");$("loginEmail").value=createdEmail;
    showMessage(data.message+" "+data.remainingSlots+" administrator slot(s) remain.","success");
  }catch(error){showMessage(error.message,"error");}
  finally{$("signUpButton").disabled=false;}
});
</script>
</body></html>
